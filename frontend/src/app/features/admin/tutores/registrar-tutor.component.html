<div class="tutores-container">
  <app-header 
    pageTitle="Registrar Tutor"
    [breadcrumbItems]="[
      { label: 'Tutores', route: '/tutores' },
      { label: 'Registrar' }
    ]">
  </app-header>

  <div class="content-wrapper">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title d-flex align-items-center gap-2">
          <i class="bi bi-person-plus"></i>
          Datos del Tutor
        </h5>

        <div class="row g-3 mt-2">
          <div class="col-md-4">
            <label class="form-label">Nombres</label>
            <input type="text" class="form-control" [(ngModel)]="tutor.nombres" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Apellido Paterno</label>
            <input type="text" class="form-control" [(ngModel)]="tutor.ap_pat" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Apellido Materno</label>
            <input type="text" class="form-control" [(ngModel)]="tutor.ap_mat" />
          </div>
          <div class="col-md-3">
            <label class="form-label">CI</label>
            <input type="text" class="form-control" [(ngModel)]="tutor.ci" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Correo</label>
            <input type="email" class="form-control" [(ngModel)]="tutor.correo" />
          </div>
          <div class="col-md-3">
            <label class="form-label">Teléfono</label>
            <input type="text" class="form-control" [(ngModel)]="tutor.telefono" />
          </div>
        </div>

        <div class="d-flex justify-content-end mt-3">
          <button class="btn btn-success" (click)="guardar()">
            <i class="bi bi-check2-circle me-1"></i>
            Guardar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
