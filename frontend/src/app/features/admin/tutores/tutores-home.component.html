<div class="tutores-container">
  <app-header 
    pageTitle="Tutores"
    [breadcrumbItems]="[
      { label: 'Tutores' }
    ]">
  </app-header>

  <div class="content-wrapper">
    <div class="row g-3">
      <div class="col-md-6">
        <div class="card action-card h-100">
          <div class="card-body d-flex flex-column justify-content-between">
            <div>
              <h5 class="card-title">
                <i class="bi bi-person-plus fs-5 text-primary"></i>
                Registrar Tutor
              </h5>
              <p class="text-muted mb-0">Crea un nuevo registro de tutor con sus datos personales y académicos.</p>
            </div>
            <div class="mt-3">
              <a routerLink="/tutores/registrar" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i>
                Ir a registro
              </a>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card action-card h-100">
          <div class="card-body d-flex flex-column justify-content-between">
            <div>
              <h5 class="card-title d-flex align-items-center gap-2">
                <i class="bi bi-person-check fs-5 text-success"></i>
                Designar Tutor
              </h5>
              <p class="text-muted mb-0">Asigna un tutor a un estudiante o proyecto de graduación.</p>
            </div>
            <div class="mt-3">
              <a routerLink="/tutores/designar" class="btn btn-success">
                <i class="bi bi-check2-circle me-1"></i>
                Ir a designación
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
