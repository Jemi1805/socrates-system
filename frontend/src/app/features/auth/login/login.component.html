<div class="login-container">
  <!-- Sección izquierda - Logo y descripción -->
  <div class="login-left">
    <div class="login-left-content">
        <h1 class="system-name">SOCRATES</h1>
        <p class="system-description">Sistema de Seguimiento de Modalidades<br>de Graduación y Titulación</p>
      <div class="logo-container">
        <img src="assets/images/LOGO-CETA.png" alt="Logo CETA" class="logo-ceta">
      </div>
    </div>
  </div>
  
  <!-- Sección derecha - Formulario -->
  <div class="login-right">
    <div class="login-right-content">
      <h2 class="login-title">INICIAR SESIÓN</h2>
      
      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
        <div class="form-group">
          <label for="nombre_usuario" class="form-label">Usuario</label>
          <input 
            type="text" 
            id="nombre_usuario"
            [(ngModel)]="credentials.nombre_usuario" 
            name="nombre_usuario" 
            required
            class="form-input"
            placeholder="Ingrese su usuario">
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <div class="password-input-wrapper">
            <input 
              [type]="passwordVisible ? 'text' : 'password'" 
              id="password"
              [(ngModel)]="credentials.password" 
              name="password" 
              required
              class="form-input"
              placeholder="Ingrese su contraseña">
            <button type="button" class="password-toggle" (click)="togglePasswordVisibility()">
              <i class="bi" [ngClass]="passwordVisible ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
        </div>

        <div *ngIf="error" class="error-message">
          <i class="bi bi-exclamation-triangle"></i>
          {{ error }}
        </div>

        <button 
          type="submit" 
          [disabled]="loading || !loginForm.valid"
          class="btn btn-primary btn-login">
          <i *ngIf="loading" class="bi bi-arrow-clockwise spin"></i>
          <span *ngIf="!loading">INGRESAR</span>
          <span *ngIf="loading">INGRESANDO...</span>
        </button>
      </form>
    </div>
  </div>
</div>
