<header class="app-header">
    <!-- Barra superior con logo y controles -->
    <div class="header-top">
      <div class="header-left">
        <button class="sidebar-toggle" (click)="toggleSidebar()" title="Menú">
          <img [src]="'assets/images/logo24.png'" alt="Logo CETA">
        </button>
        
        <div class="logo">
          <h1 class="logo-text">SOCRATES</h1>
          <span class="logo-subtitle">Sistema de Seguimiento de Modalidades de Graduación y Titulación</span>
        </div>
      </div>

      <div class="header-right">
        <!-- Configuración -->
        <button class="header-btn" [routerLink]="'/configuracion'" title="Configuración">
          <i class="bi bi-gear icon"></i>
        </button>
        <!-- Usuario -->
        <div class="user-menu" [class.open]="dropdownOpen">
          <button class="user-btn" (click)="toggleUserMenu()" [attr.aria-expanded]="dropdownOpen" aria-haspopup="true" title="Usuario">
            <div class="user-avatar">
              <i class="bi bi-person"></i>
            </div>
            <div class="user-info">
              <span class="user-name">{{ currentUser.name }}</span>
              <span class="user-role">{{ currentUser.role }}</span>
            </div>
            <i class="bi bi-chevron-down" [class.rotate]="dropdownOpen"></i>
          </button>
          <div class="user-dropdown" *ngIf="dropdownOpen">
            <button type="button" class="dropdown-item" (click)="logout()">
              <i class="bi bi-box-arrow-right me-2"></i>
              Cerrar sesión
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Barra de navegación -->
    <nav class="navigation-bar">
      <ul class="nav-menu">
        <li *ngFor="let item of menuItems" class="nav-item">
          <a 
            [routerLink]="item.route" 
            routerLinkActive="active"
            [class.active]="item.active"
            class="nav-link"
            (click)="setActiveItem(item.route)">
            {{ item.label }}
          </a>
        </li>
      </ul>
    </nav>
  </header>
